<style>

  .brand-tag{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-soft);background:var(--card);border:1px solid var(--line);padding:3px 8px;border-radius:20px;}

  .route{position:relative;height:24px;margin-bottom:22px;}
  .route-track{position:absolute;top:50%;left:2px;right:2px;height:3px;background:var(--line);border-radius:2px;transform:translateY(-50%);}
  .route-fill{position:absolute;top:50%;left:2px;height:3px;background:var(--amber);border-radius:2px;transform:translateY(-50%);width:0%;transition:width .35s ease;}

  .prompt{text-align:center;margin-bottom:16px;}
  .prompt-eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);}

  .vs-card{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line);min-height:280px;box-shadow:0 1px 2px rgba(19,32,51,0.05);display:flex;flex-direction:column;}
  .vs-half{padding:34px 22px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;transition:transform .12s ease, filter .12s ease;flex:1;}
  .vs-half:active{transform:scale(0.98);}
  .vs-half.left{background:var(--teal-soft);}
  .vs-half.right{background:var(--amber-soft);}
  .vs-label{font-family:'Fraunces',serif;font-weight:600;font-size:22px;line-height:1.3;color:var(--ink);}
  .vs-badge{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;
    display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;
    font-size:11px;font-weight:600;z-index:2;box-shadow:0 0 0 4px var(--paper);
  }
  .cat-chip{
    position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
    font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.04em;text-transform:uppercase;
    color:var(--ink-soft);background:rgba(255,255,255,0.75);padding:3px 9px;border-radius:20px;z-index:2;
  }

  .flash{animation:flashpop .28s ease;}
  @keyframes flashpop{0%{filter:brightness(1);}40%{filter:brightness(0.85);}100%{filter:brightness(1);}}

  .start-card, .final-card{background:var(--card);border-radius:20px;border:1px solid var(--line);padding:32px 26px;text-align:center;min-height:280px;display:flex;flex-direction:column;justify-content:center;}
  .start-title{font-family:'Fraunces',serif;font-weight:600;font-size:25px;line-height:1.3;margin:0 0 12px;}
  .start-sub{font-size:14.5px;color:var(--ink-soft);line-height:1.55;margin:0 0 24px;}
  .btn{font-family:'Inter',sans-serif;font-weight:700;font-size:15px;border:none;border-radius:30px;padding:15px 22px;cursor:pointer;transition:all .15s ease;}
  .btn-primary{background:var(--ink);color:#fff;}
  .btn-primary:hover{background:#000;}

  .final-card{background:var(--ink);color:#fff;text-align:left;}
  .final-eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--amber);margin-bottom:10px;text-align:center;}
  .final-headline{font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:27px;line-height:1.25;margin:0 0 14px;text-align:center;}
  .final-body{font-size:14px;line-height:1.6;color:rgba(255,255,255,0.82);text-align:left;margin:0 0 22px;}
  .disclaimer{margin-top:14px;text-align:center;font-size:11px;line-height:1.5;color:rgba(255,255,255,0.45);border-top:1px solid rgba(255,255,255,0.12);padding-top:12px;}
  .recap{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:24px;}
  .recap-chip{font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.18);padding:6px 12px;border-radius:20px;}
  .btn-cta{background:var(--amber);color:var(--ink);width:100%;font-size:16px;padding:16px;}
  .btn-cta:hover{background:#e8ab52;}
  .pool-note{margin-top:16px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:rgba(255,255,255,0.5);}

  @media (max-width:380px){ .vs-label{font-size:18px;} .final-headline{font-size:22px;} }

function axisAverage(answers, tagTable){
  const scores = answers.map(a => tagTable[a.value]).filter(v => v !== undefined);
  if(scores.length === 0) return null;
  return scores.reduce((a,b)=>a+b, 0) / scores.length;
}

function buildProfile(answers){
  const persoonlijk = answers.filter(a=>a.cat==='persoonlijk');
  const werk = answers.filter(a=>a.cat==='organisatie' || a.cat==='functie');

  const persoonlijkEnergie = axisAverage(persoonlijk, ENERGY_TAGS);
  const werkEnergie = axisAverage(werk, ENERGY_TAGS);
  const regie = axisAverage(werk, REGIE_TAGS);

  let headline, body;

  if(persoonlijkEnergie !== null && werkEnergie !== null){
    // Sterkste geval: privé én werk hebben allebei een energie-signaal — vergelijk ze.
    if(persoonlijkEnergie > 0 && werkEnergie < 0){
      headline = "Rust waar het kan, actie waar het moet";
      body = "In je vrije tijd zoek je kalmte en zekerheid — maar op het werk trekt juist beweging en verandering. Dat is geen tegenstrijdigheid: het lijkt erop dat jij zelf wilt bepalen wanneer het tempo omhoog gaat, niet dat het je wordt opgelegd.";
    } else if(persoonlijkEnergie < 0 && werkEnergie > 0){
      headline = "Buiten actief, op het werk de vaste factor";
      body = "Privé zoek je liever iets nieuws op, maar op het werk lijkt een stabiele, voorspelbare omgeving je meer te liggen. Mogelijk fungeert werk voor jou als het rustpunt naast een actief leven.";
    } else if(persoonlijkEnergie > 0 && werkEnergie > 0){
      headline = "Privé en werk lopen bij jou gelijk op — richting kalmte";
      body = "Zowel in je vrije tijd als op het werk kies je voor zekerheid en een vaste koers boven verrassing. Dat consistente patroon zegt waarschijnlijk iets over hoe belangrijk voorspelbaarheid voor je is, in beide werelden.";
    } else {
      headline = "Privé en werk lopen bij jou gelijk op — richting actie";
      body = "Zowel in je vrije tijd als op het werk trekt beweging en verandering je meer dan rust. Stilstand is vermoedelijk niet waar jij van opknapt.";
    }
  } else if(regie !== null){
    // Tweede beste geval: geen volledige energie-vergelijking, maar wel een duidelijk regie-signaal.
    if(regie > 0){
      headline = "Jij pakt graag zelf de regie";
      body = "Uit je werk-gerelateerde keuzes valt vooral op dat jij liever zelf het plan bepaalt en beslissingen neemt, dan dat je een uitgestippeld pad volgt.";
    } else {
      headline = "Jij werkt het liefst binnen een duidelijk kader";
      body = "Uit je werk-gerelateerde keuzes valt vooral op dat een duidelijk afgesproken kader je meer ligt dan zelf voortdurend de koers moeten bepalen.";
    }
    if(werkEnergie !== null){
      body += werkEnergie > 0
        ? " Daarbij zoek je in je werkomgeving ook meer stabiliteit dan verandering."
        : " Daarbij trekt een dynamische, veranderlijke werkomgeving je meer dan een voorspelbare.";
    } else if(persoonlijkEnergie !== null){
      body += persoonlijkEnergie > 0
        ? " Privé zoek je daarnaast vooral rust en zekerheid."
        : " Privé trekt daarnaast vooral actie en verandering.";
    }
  } else if(werkEnergie !== null){
    // Alleen signaal op werk-energie, geen regie, geen persoonlijk signaal.
    headline = werkEnergie > 0 ? "Op je werk zoek je vooral zekerheid" : "Op je werk trekt vooral verandering";
    body = werkEnergie > 0
      ? "Uit je keuzes rond organisatie en functie blijkt een voorkeur voor stabiliteit, structuur en het bekende pad."
      : "Uit je keuzes rond organisatie en functie blijkt een voorkeur voor beweging, verandering en nieuwe situaties.";
  } else if(persoonlijkEnergie !== null){
    // Alleen signaal op persoonlijke energie.
    headline = persoonlijkEnergie > 0 ? "In je vrije tijd kies je vooral voor rust" : "In je vrije tijd kies je vooral voor actie";
    body = persoonlijkEnergie > 0
      ? "Je persoonlijke keuzes wijzen op een voorkeur voor kalmte, zekerheid en het bekende."
      : "Je persoonlijke keuzes wijzen op een voorkeur voor beweging, spontaniteit en het nieuwe.";
  } else {
    headline = "Een begin van een beeld";
    body = "Met deze combinatie van antwoorden is er nog geen uitgesproken patroon te zien — dat wordt scherper naarmate er meer vragen bij komen.";
  }

  return { headline, body };
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function drawSession(){
  let cards = [];
  Object.entries(DRAW_PLAN).forEach(([cat,n])=>{
    const picks = shuffle(POOL[cat]).slice(0,n);
    picks.forEach(pair => cards.push({ cat, left: pair[0], right: pair[1] }));
  });
  return shuffle(cards);
}

const state = { started:false, cards:[], step:0, answers:[] };
const stage = document.getElementById('stage');
const routeFill = document.getElementById('routeFill');

function render(){
  if(!state.started){ renderStart(); return; }
  if(state.step >= state.cards.length){ renderFinal(); return; }
  renderCard();
}

function renderStart(){
  routeFill.style.width = '0%';
  const n = Object.values(DRAW_PLAN).reduce((a,b)=>a+b, 0);
  stage.innerHTML = `
    <div class="start-card">
      <div class="start-title">Even snel — ${n} dingen, geen goed of fout.</div>
      <p class="start-sub">Tik gewoon je onderbuikgevoel. Duurt hooguit een minuut of twee, en je krijgt aan het eind een klein flitsprofiel van jezelf.</p>
      <button class="btn btn-primary" onclick="startFlow()">Start →</button>
    </div>
  `;
}
function startFlow(){
  state.cards = drawSession();
  state.step = 0;
  state.answers = [];
  state.started = true;
  render();
}

function labelForCat(cat){
  return { grappig:"Even lachen", persoonlijk:"Persoonlijk", organisatie:"Organisatie", functie:"Manier van werken" }[cat] || cat;
}
function escapeQ(s){ return s.replace(/'/g, "\\'"); }

function renderCard(){
  const c = state.cards[state.step];
  routeFill.style.width = ((state.step)/state.cards.length*100) + '%';
  stage.innerHTML = `
    <div class="prompt">
      <div class="prompt-eyebrow">${state.step+1} / ${state.cards.length}</div>
    </div>
    <div class="vs-card" id="vsCard">
      <div class="vs-half left" onclick="pick('${escapeQ(c.left)}')"><div class="vs-label">${c.left}</div></div>
      <div class="vs-half right" onclick="pick('${escapeQ(c.right)}')"><div class="vs-label">${c.right}</div></div>
      <div class="vs-badge">of</div>
      <div class="cat-chip">${labelForCat(c.cat)}</div>
    </div>
  `;
}

function pick(value){
  const c = state.cards[state.step];
  state.answers.push({ cat:c.cat, value });
  const card = document.getElementById('vsCard');
  card.classList.add('flash');
  setTimeout(()=>{
    state.step += 1;
    render();
  }, 180);
}

function renderFinal(){
  routeFill.style.width = '100%';
  const profile = buildProfile(state.answers);

  stage.innerHTML = `
    <div class="final-card">
      <div class="final-eyebrow">Jouw flitsprofiel</div>
      <p class="final-headline">"${profile.headline}"</p>
      <p class="final-body">${profile.body}</p>
      <div class="recap">
        ${state.answers.map(a=>`<span class="recap-chip">${a.value}</span>`).join('')}
      </div>
      <button class="btn btn-cta" onclick="alert('Demo — dit gaat in productie direct het profiel verrijken en de volgende stap in de kandidaatreis openen.')">Ontdek wat dit voor jou betekent →</button>
      <div class="pool-note">Getrokken uit een groeiende bak van 500+ vragen — morgen weer anders</div>
      <div class="disclaimer">Dit beeld is gebaseerd op ${state.answers.length} losse keuzes van vandaag — leuk om over na te denken, maar niet wetenschappelijk onderbouwd. Verbind hier vooral geen conclusies aan.</div>
    </div>
  `;
}

render();
</script>
