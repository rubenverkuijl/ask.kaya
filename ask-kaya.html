<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ask Kaya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#132033; --ink-soft:#3c4a5c; --paper:#F1F3F0; --card:#FFFFFF; --line:#DBE0DA;
    --amber:#DE9A3C; --amber-soft:#F5E3C4; --teal:#4F8C86; --teal-soft:#DCEAE7;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;justify-content:center;padding:32px 16px 60px;}
  .app{width:100%;max-width:480px;}

  .brand{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;}
  .brand-name{font-family:'Fraunces',serif;font-weight:700;font-size:20px;letter-spacing:-0.01em;}
  .brand-tag{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-soft);background:var(--card);border:1px solid var(--line);padding:3px 8px;border-radius:20px;}

  /* ---- Continuous progress bar with a checkpoint marker ---- */
  .route{position:relative;height:24px;margin-bottom:22px;}
  .route-track{position:absolute;top:50%;left:2px;right:2px;height:3px;background:var(--line);border-radius:2px;transform:translateY(-50%);}
  .route-fill{position:absolute;top:50%;left:2px;height:3px;background:var(--amber);border-radius:2px;transform:translateY(-50%);width:0%;transition:width .4s ease;}
  .checkpoint{
    position:absolute;top:50%;transform:translate(-50%,-50%);
    width:18px;height:18px;border-radius:50%;background:var(--card);border:2px solid var(--teal);
    display:flex;align-items:center;justify-content:center;font-size:9px;z-index:2;
  }
  .prompt-eyebrow{
    text-align:center;font-family:'JetBrains Mono',monospace;font-size:11px;
    letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:16px;
  }

  /* ---- Card (Part A: question form) ---- */
  .card{background:var(--card);border-radius:var(--radius);border:1px solid var(--line);padding:28px 24px;min-height:340px;display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(19,32,51,0.04);}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--teal);margin-bottom:10px;}
  .back-link{background:none;border:none;padding:0;margin-bottom:16px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink-soft);cursor:pointer;display:inline-block;}
  .back-link:hover{color:var(--teal);}
  .start-card{justify-content:center;}
  .start-card .question{font-size:24px;}
  .start-card .card-footer{padding-top:26px;justify-content:flex-start;}

  .question{font-family:'Fraunces',serif;font-weight:500;font-size:26px;line-height:1.28;margin:0 0 22px;letter-spacing:-0.01em;}
  .question em{font-style:italic;color:var(--teal);}

  .choices{display:flex;flex-direction:column;gap:10px;}
  .choice-row{display:flex;gap:10px;}
  .choice{flex:1;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:16px 14px;font-family:'Inter',sans-serif;font-size:15px;font-weight:600;color:var(--ink);cursor:pointer;text-align:left;transition:all .15s ease;line-height:1.35;}
  .choice .sub{display:block;font-family:'Inter',sans-serif;font-weight:400;font-size:12.5px;color:var(--ink-soft);margin-top:3px;}
  .choice:hover{border-color:var(--teal);transform:translateY(-1px);}
  .choice.selected{background:var(--teal-soft);border-color:var(--teal);}
  .choice.grid{flex:1 1 calc(50% - 5px);}
  .choice-grid{display:flex;flex-wrap:wrap;gap:10px;}

  .text-input{width:100%;border:1.5px solid var(--line);background:var(--paper);border-radius:14px;padding:14px;font-family:'Inter',sans-serif;font-size:15px;color:var(--ink);resize:none;min-height:78px;}
  .text-input:focus{outline:none;border-color:var(--teal);}

  .sliders{display:flex;flex-direction:column;gap:22px;}
  .slider-row{display:flex;flex-direction:column;gap:8px;}
  .slider-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
  .slider-label{font-size:14px;font-weight:600;color:var(--ink);line-height:1.3;}
  .slider-tier{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--teal);white-space:nowrap;}
  input.slider{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:var(--line);outline:none;}
  input.slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;background:var(--teal);border:3px solid #fff;box-shadow:0 0 0 1px var(--teal);cursor:pointer;}
  input.slider::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--teal);border:3px solid #fff;box-shadow:0 0 0 1px var(--teal);cursor:pointer;}

  .field-block{margin-bottom:20px;}
  .field-label{display:block;font-size:14px;font-weight:600;color:var(--ink);margin-bottom:8px;}
  .optional-tag{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:500;color:var(--ink-soft);text-transform:none;letter-spacing:0;}
  .field-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:14.5px;font-weight:600;color:var(--ink);}
  .inline-input{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 10px;font-family:'Inter',sans-serif;font-size:14.5px;font-weight:600;color:var(--ink);min-width:0;}
  .inline-input.small{width:64px;text-align:center;}
  .inline-input:not(.small){flex:1;min-width:120px;}
  .inline-input:focus{outline:none;border-color:var(--teal);}
  .text-input-line{width:100%;border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:12px;font-family:'Inter',sans-serif;font-size:14.5px;color:var(--ink);}
  .text-input-line:focus{outline:none;border-color:var(--teal);}

  .card-footer{margin-top:auto;padding-top:22px;display:flex;justify-content:flex-end;}
  .btn{font-family:'Inter',sans-serif;font-weight:700;font-size:14px;border:none;border-radius:30px;padding:12px 22px;cursor:pointer;transition:all .15s ease;}
  .btn-primary{background:var(--ink);color:#fff;}
  .btn-primary:hover{background:#000;}
  .btn-ghost{background:transparent;color:var(--ink-soft);padding:12px 8px;}

  /* ---- Reciprocity insight (Part A) ---- */
  .insight{background:var(--ink);color:#fff;border-radius:var(--radius);padding:24px;min-height:340px;display:flex;flex-direction:column;justify-content:center;}
  .insight-label{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);margin-bottom:14px;}
  .insight-text{font-family:'Fraunces',serif;font-style:italic;font-weight:500;font-size:22px;line-height:1.4;margin:0 0 24px;}
  .insight .btn-primary{background:var(--amber);color:var(--ink);}
  .insight .btn-primary:hover{background:#e8ab52;}

  /* ---- Part B: dit-of-dat cards ---- */
  .vs-card{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line);min-height:280px;box-shadow:0 1px 2px rgba(19,32,51,0.05);display:flex;flex-direction:column;}
  .vs-half{padding:34px 22px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;transition:transform .12s ease, filter .12s ease;flex:1;}
  .vs-half:active{transform:scale(0.98);}
  .vs-half.left{background:var(--teal-soft);}
  .vs-half.right{background:var(--amber-soft);}
  .vs-label{font-family:'Fraunces',serif;font-weight:600;font-size:22px;line-height:1.3;color:var(--ink);}
  .vs-badge{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;z-index:2;box-shadow:0 0 0 4px var(--paper);}
  .cat-chip{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);background:rgba(255,255,255,0.75);padding:3px 9px;border-radius:20px;z-index:2;}
  .flash{animation:flashpop .28s ease;}
  @keyframes flashpop{0%{filter:brightness(1);}40%{filter:brightness(0.85);}100%{filter:brightness(1);}}

  /* ---- Unlock / final panels ---- */
  .unlock-card, .final-card{background:var(--ink);color:#fff;border-radius:var(--radius);padding:30px 24px;text-align:center;}
  .unlock-label, .final-eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);margin-bottom:10px;}
  .unlock-title{font-family:'Fraunces',serif;font-weight:600;font-size:23px;line-height:1.3;margin:0 0 18px;}
  .final-headline{font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:25px;line-height:1.28;margin:0 0 14px;}
  .final-body{font-size:14px;line-height:1.6;color:rgba(255,255,255,0.82);text-align:left;margin:0 0 22px;}

  .group-label{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:rgba(255,255,255,0.5);margin:0 0 8px;text-align:left;}
  .tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:20px;}
  .tags.left{justify-content:flex-start;}
  .tag{font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.18);padding:6px 12px;border-radius:20px;}

  .match-count{font-family:'JetBrains Mono',monospace;font-size:42px;font-weight:600;color:var(--amber);line-height:1;margin-bottom:6px;text-align:center;}
  .match-sub{font-size:13px;color:rgba(255,255,255,0.65);margin-bottom:24px;text-align:center;}

  .final-actions{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
  .btn-cta{background:var(--amber);color:var(--ink);font-size:15px;padding:15px;width:100%;}
  .btn-cta:hover{background:#e8ab52;}
  .btn-secondary{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,0.3);width:100%;}
  .skip-note{margin-top:14px;text-align:center;}
  .skip-note button{background:none;border:none;font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(255,255,255,0.45);cursor:pointer;}
  .skip-note button:hover{color:#fff;}

  .why-link{display:block;margin-top:18px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:rgba(255,255,255,0.55);text-decoration:none;letter-spacing:.01em;}
  .why-link:hover{color:var(--amber);}

  .preview-jobs{margin-top:16px;display:none;flex-direction:column;gap:8px;text-align:left;}
  .preview-jobs.active{display:flex;}
  .job-card{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);color:#fff;border-radius:12px;padding:12px 14px;}
  .job-title{font-weight:600;font-size:14px;margin-bottom:2px;}
  .job-meta{font-size:12px;color:rgba(255,255,255,0.6);font-family:'JetBrains Mono',monospace;}

  .disclaimer{margin-top:16px;text-align:center;font-size:11px;line-height:1.5;color:rgba(255,255,255,0.45);border-top:1px solid rgba(255,255,255,0.12);padding-top:12px;}

  @media (max-width:380px){ .question{font-size:22px;} .vs-label{font-size:18px;} .final-headline{font-size:21px;} .match-count{font-size:36px;} }
</style>
</head>
<body>
<div class="app">
  <div class="brand"><div class="brand-name">ask kaya</div><div class="brand-tag">concept</div></div>
  <div class="route">

    <div class="route-fill" id="routeFill"></div>
    <div class="checkpoint" id="checkpoint" style="left:37.5%"></div>
  </div>
  <div id="promptEyebrow" class="prompt-eyebrow" style="display:none;"></div>
  <div id="stage"></div>
</div>

function axisAverage(answers, tagTable){
  const scores = answers.map(a => tagTable[a.value]).filter(v => v !== undefined);
  if(scores.length === 0) return null;
  return scores.reduce((a,b)=>a+b, 0) / scores.length;
}

function getInsightTextA(q, ans){
  if(q.type === 'practical') return q.insight.default || "Genoteerd.";
  if(ans && typeof ans === 'object'){
    const sorted = Object.entries(ans).sort((a,b)=>b[1]-a[1]);
    const flat = (sorted[0][1] - sorted[sorted.length-1][1]) <= 15;
    if(flat) return q.insight.balanced || "Genoteerd.";
    return q.insight[sorted[0][0]] || q.insight.default || "Genoteerd.";
  }
  return q.insight[ans] || q.insight.default || "Genoteerd.";
}

      <div class="unlock-label">Deel 1 compleet</div>
      <p class="unlock-title">Vacatures ontgrendeld</p>
      <div class="tags">${tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      <div class="match-count" id="matchCount">0</div>
      <div class="match-sub">van de 190.000 vacatures passen mogelijk bij jou</div>
      <div class="final-actions">
        <button class="btn btn-cta" onclick="startPartB()">Nog 10 korte vragen voor een afspraak met een recruiter →</button>
        <button class="btn btn-secondary" onclick="revealJobsA()">Bekijk vacatures nu</button>
      </div>
      <div class="preview-jobs" id="previewJobsA"></div>
    </div>
  `;
  animateCount(Math.max(count,140));
}
function animateCount(target){
  const el = document.getElementById('matchCount');
  let cur=0; const step=Math.max(1,Math.floor(target/40));
  const t=setInterval(()=>{ cur+=step; if(cur>=target){cur=target;clearInterval(t);} el.textContent=cur.toLocaleString('nl-NL'); },25);
}
function revealJobsA(){
  const box = document.getElementById('previewJobsA');
  box.innerHTML = jobPool.slice(0,3).map(j=>`<div class="job-card"><div class="job-title">${j.title}</div><div class="job-meta">${j.meta}</div></div>`).join('');
  box.classList.add('active');
}

function startPartB(){ state.cardsB = drawSession(); state.stepB=0; state.answersB=[]; state.stage='partB'; render(); }

function renderPartB(){
  promptEyebrow.style.display = 'block';
  promptEyebrow.textContent = `Vraag ${questionsA.length + state.stepB + 1} van ${TOTAL_STEPS}`;
  const c = state.cardsB[state.stepB];
  stage.innerHTML = `
    <div class="vs-card" id="vsCard">
      <div class="vs-half left" onclick="pickB('${escapeQ(c.left)}')"><div class="vs-label">${c.left}</div></div>
      <div class="vs-half right" onclick="pickB('${escapeQ(c.right)}')"><div class="vs-label">${c.right}</div></div>
      <div class="vs-badge">of</div>
      <div class="cat-chip">${labelForCat(c.cat)}</div>
    </div>
  `;
}
function pickB(value){
  const c = state.cardsB[state.stepB];
  state.answersB.push({ cat:c.cat, value });
  document.getElementById('vsCard').classList.add('flash');
  setTimeout(()=>{
    state.stepB += 1;
    if(state.stepB >= state.cardsB.length){ state.stage = 'final'; }
    render();
  }, 180);
}

function renderFinal(){
  promptEyebrow.style.display = 'none';
  const profile = buildProfileB(state.answersB);
  const tagsA = profileTagsA();
  stage.innerHTML = `
    <div class="final-card">
      <div class="final-eyebrow">Compleet — klaar voor een gesprek met een recruiter</div>
      <p class="final-headline">"${profile.headline}"</p>
      <p class="final-body">${profile.body}</p>

      <div class="group-label">Uit deel 1 — je matchingprofiel</div>
      <div class="tags left">${tagsA.map(t=>`<span class="tag">${t}</span>`).join('')}</div>

      <div class="group-label">Uit deel 2 — je flitsprofiel</div>
      <div class="tags left">${state.answersB.map(a=>`<span class="tag">${a.value}</span>`).join('')}</div>

      <div class="final-actions" style="margin-top:22px;">
        <button class="btn btn-cta" onclick="alert('Demo — dit opent in productie de agenda van de best passende recruiter.')">Plan een gesprek met een recruiter</button>
      </div>
      <a class="why-link" href="kayak-waarom-dit-werkt.html" target="_blank" rel="noopener">Waarom dit werkt — de psychologie erachter →</a>
      <div class="disclaimer">Deel 2 is gebaseerd op ${state.answersB.length} losse keuzes van vandaag — leuk om over na te denken, maar niet wetenschappelijk onderbouwd. Verbind hier vooral geen conclusies aan.</div>
    </div>
  `;
}

render();
</script>
</body>
</html>
